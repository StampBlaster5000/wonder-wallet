<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wonder Terminal — Wonder Wallet</title>
  <meta name="description" content="Wonder Terminal — the full self-custodial Wonder Wallet dashboard. Hardware-wallet & temporary access to Counterparty / Stamps / SRC-20 tooling. Keys never leave your browser." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="favicon-180.png" />
</head>
<body>
  <div class="aurora"></div>
  <div class="gridfield" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./" title="Wonder Wallet — home">
      <span class="seal" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34">
          <defs>
            <radialGradient id="g" cx="50%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#F4D58D" /><stop offset="55%" stop-color="#E0B453" /><stop offset="100%" stop-color="#9a6f1f" />
            </radialGradient>
          </defs>
          <circle cx="24" cy="24" r="22" fill="url(#g)" />
          <circle cx="24" cy="24" r="22" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1" />
          <path d="M12 17 L17.5 32 L24 21 L30.5 32 L36 17" fill="none" stroke="#3a2606" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" />
        </svg>
      </span>
      <div class="wordmark">
        <span class="name">Wonder Terminal</span>
      </div>
    </a>
    <div class="meta">
      <a class="nav-login" href="./" title="Back to homepage">Home</a>
      <span class="badge" id="phaseBadge">Beta</span>
      <span class="ver" id="verTag">v0.35.0</span>
    </div>
  </header>

  <div class="term-shell no-rail" id="termShell">
    <!-- Docked tools rail (dApp dashboard) — first-party tooling + connections. Rendered by dapps.js. -->
    <aside class="toolrail" id="toolRail" aria-label="Tools panel"></aside>

    <main class="wrap">
      <!-- The full wallet renders here: unlock · create · restore · hardware-wallet · dashboard. -->
      <section class="card wallet-card" id="wallet">
        <div id="walletBody"><div class="statusline load">Loading key engine…</div></div>
      </section>
    </main>
  </div>

  <!-- Scrim behind the rail when it opens as a drawer on mobile -->
  <div class="rail-scrim" id="railScrim" hidden></div>

  <div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>

  <script src="wallet-core.js"></script>
  <script src="net-mode.js"></script>
  <script src="wwfee.js"></script>
  <script src="addrbook.js"></script>

  <footer class="foot">
    <span>Wonder Wallet · independent community wallet</span><span class="dot">·</span>
    <span>Bridge powered by Emblem Vault · Built on Emblem&nbsp;Build</span><span class="dot">·</span>
    <span><a href="https://github.com/StampBlaster5000/wonder-wallet" class="foot-link" target="_blank" rel="noopener">GitHub</a></span><span class="dot">·</span>
    <span><a href="https://t.me/TryWonderWallet" class="foot-link" target="_blank" rel="noopener">Telegram</a></span><span class="dot">·</span>
    <span><a href="./privacy.html" class="foot-link">Privacy Policy</a></span>
  </footer>

  <script src="app.js"></script>
  <script src="coin-control.js"></script>
  <script src="verifier.js"></script>
  <script src="wonder-sign.js"></script>
  <script src="xcp69.js"></script>
  <script src="cp-flow.js"></script>
  <script src="cp-actions.js"></script>
  <script src="evm.js"></script>
  <script src="sol.js"></script>
  <script src="emblem.js"></script>
  <script src="hardware-ui.js"></script>
  <script src="minting.js"></script>
  <script src="dapps.js"></script>
  <script src="xcp-launch.js"></script>
  <script src="markets.js"></script>
  <script src="src101.js"></script>
  <script src="backup.js"></script>
  <script src="qrcode.js"></script>
  <script src="wallet-connect.js"></script>
  <script src="wallet-ui.js"></script>
  <script src="topbar.js"></script>
</body>
</html>
