name: CI

# Runs on every push to main and on pull requests. Proves the wallet still builds and the
# hand-written server + browser scripts are syntactically valid. Purely a safety net — it reads the
# code and builds it in a throwaway VM; it never touches users, secrets, or the live deployment.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build key engine (wallet-core)
        run: npm run build:core

      - name: Build hardware engine (wallet-hw)
        run: npm run build:hw

      - name: Build browser extension
        run: |
          npm install -g @resvg/resvg-js   # native SVG→PNG used only to render the extension icons
          NODE_PATH="$(npm root -g)" node extension/build-ext.mjs

      - name: Artifact provenance (WW-C01)
        # The audit found the published beta zips were pre-audit and CI could not prove an artifact was
        # built from the reviewed commit. This step FAILS if the built extension is absent, and publishes
        # the source commit + a deterministic checksum of the built dist tree so every green build has a
        # verifiable provenance record (compare it to any published zip before distributing).
        run: |
          set -e
          test -f extension/dist/manifest.json || { echo "::error::built extension manifest missing — the extension artifact was not produced"; exit 1; }
          COMMIT="$(git rev-parse HEAD)"
          SHA="$(find extension/dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "Extension built from commit: $COMMIT"
          echo "Extension dist tree SHA-256: $SHA"
          { echo "### Extension artifact provenance"; echo "- commit: \`$COMMIT\`"; echo "- dist SHA-256: \`$SHA\`"; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Syntax check (server + browser scripts)
        run: |
          set -e
          # audit #7: recurse into extension/src/provider/ (the dApp-provider stack was previously unchecked)
          shopt -s globstar
          for f in server.js sources/*.js extension/src/**/*.js public/*.js; do
            node --check "$f" || { echo "::error file=$f::Syntax error"; exit 1; }
          done
          echo "All server + browser scripts parsed cleanly."

      - name: Dependency audit (audit #7)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported advisories (non-blocking)"

      - name: Run test suites
        # Pure logic/crypto tests — no server, no browser, no secrets. Covers BIP-322/EIP-712/
        # personal_sign signing, the dApp provider spine, local tx verification, and testnet isolation.
        # (tests/playwright + tests/selenium are excluded — they need a live server/browser.)
        run: |
          fail=0
          for t in tests/*.mjs tests/*.cjs; do
            if out=$(node "$t" 2>&1) && printf '%s' "$out" | grep -q "✅"; then
              echo "✓ $t"
            else
              echo "::error file=$t::Test suite failed"
              printf '%s\n' "$out" | tail -25
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "All test suites passed." || exit 1
