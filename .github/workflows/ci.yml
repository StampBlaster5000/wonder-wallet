name: CI

# Runs on every push to main and on pull requests. Proves the wallet still builds and the
# hand-written server + browser scripts are syntactically valid. Purely a safety net — it reads the
# code and builds it in a throwaway VM; it never touches users, secrets, or the live deployment.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build key engine (wallet-core)
        run: npm run build:core

      - name: Build hardware engine (wallet-hw)
        run: npm run build:hw

      - name: Build browser extension
        run: |
          npm install -g @resvg/resvg-js   # native SVG→PNG used only to render the extension icons
          NODE_PATH="$(npm root -g)" node extension/build-ext.mjs

      - name: Artifact provenance + integrity (WW-C01)
        # The audit found the published beta zips were pre-audit and CI could not prove an artifact was
        # built from the reviewed commit. This step FAILS on: (a) a missing artifact, (b) a DIRTY tree
        # after build — a tracked source file differs, so the artifact is NOT reproducible from the
        # committed source (a stale/tampered build can otherwise stamp a clean-looking commit), and
        # (c) a published-checksum mismatch. It records the commit + the zip's SHA-256 so any published
        # download can be verified out-of-band.
        run: |
          set -e
          test -f extension/dist/manifest.json || { echo "::error::built extension manifest missing — the extension artifact was not produced"; exit 1; }
          # (b) Dirty-tree gate: the build only writes gitignored artifacts (dist/, zips, build-info.json),
          # so after building from a clean checkout no TRACKED file may differ. If one does, the source that
          # produced this artifact is not the committed source — fail closed.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is dirty after build — the artifact is not reproducible from the committed source (WW-C01)"
            git status --porcelain
            exit 1
          fi
          # build-info.json must self-report a clean build and carry a checksum.
          node -e "const b=require('./public/build-info.json'); if(b.dirty){console.error('::error::build-info.dirty=true — built from uncommitted changes');process.exit(1)} if(!b.sha256){console.error('::error::build-info.json missing sha256');process.exit(1)}"
          # (c) The published checksum must equal the actual bytes of the shipped zip.
          ZIP="public/$(node -e "console.log(require('./public/build-info.json').zip)")"
          PUB_SHA="$(node -e "console.log(require('./public/build-info.json').sha256)")"
          ACT_SHA="$(sha256sum "$ZIP" | cut -d' ' -f1)"
          [ "$PUB_SHA" = "$ACT_SHA" ] || { echo "::error::published sha256 ($PUB_SHA) != actual zip sha256 ($ACT_SHA)"; exit 1; }
          COMMIT="$(git rev-parse HEAD)"
          echo "Extension built from commit: $COMMIT (clean tree)"
          echo "Published zip SHA-256: $ACT_SHA"
          { echo "### Extension artifact provenance"; echo "- commit: \`$COMMIT\`"; echo "- clean tree: ✅"; echo "- zip SHA-256: \`$ACT_SHA\`"; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Syntax check (server + browser scripts)
        run: |
          set -e
          # audit #7: recurse into extension/src/provider/ (the dApp-provider stack was previously unchecked)
          shopt -s globstar
          for f in server.js sources/*.js extension/src/**/*.js public/*.js; do
            node --check "$f" || { echo "::error file=$f::Syntax error"; exit 1; }
          done
          echo "All server + browser scripts parsed cleanly."

      - name: Dependency audit (audit #7)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported advisories (non-blocking)"

      - name: Run test suites
        # Pure logic/crypto tests — no server, no browser, no secrets. Covers BIP-322/EIP-712/
        # personal_sign signing, the dApp provider spine, local tx verification, and testnet isolation.
        # (tests/playwright + tests/selenium are excluded — they need a live server/browser.)
        run: |
          fail=0
          for t in tests/*.mjs tests/*.cjs; do
            if out=$(node "$t" 2>&1) && printf '%s' "$out" | grep -q "✅"; then
              echo "✓ $t"
            else
              echo "::error file=$t::Test suite failed"
              printf '%s\n' "$out" | tail -25
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "All test suites passed." || exit 1
